name: Nightly fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "src/**"
      - "tests/test_fuzz.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fuzz (10k examples per property)
        run: HYPOTHESIS_PROFILE=nightly pytest tests/test_fuzz.py -q
