[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "sql-semantic-guard"
version = "0.1.0"
description = "Semantic firewall for LLM-generated SQL: catalog-aware validation, row-level security injection, and pre-execution cost limits."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "sql-semantic-guard contributors" }]
keywords = [
    "sql",
    "llm",
    "text-to-sql",
    "nl2sql",
    "guardrails",
    "row-level-security",
    "sqlglot",
    "athena",
    "postgres",
    "validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["sqlglot>=25.0"]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0"]
athena = ["boto3>=1.28"]
all = ["sqlalchemy>=2.0", "boto3>=1.28"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "hypothesis>=6.100", "ruff>=0.4", "mypy>=1.8", "sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/sidtitun/sql-semantic-guard"
Repository = "https://github.com/sidtitun/sql-semantic-guard"
Issues = "https://github.com/sidtitun/sql-semantic-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlguard"]

[tool.hatch.build.targets.sdist]
include = ["src/sqlguard", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "C401", "C408"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]

[tool.mypy]
python_version = "3.9"
packages = ["sqlguard"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
